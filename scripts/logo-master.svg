<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <!-- Progress Ring (outer) -->
  <!-- r=360, 270° segment, 90° gap at bottom-left -->
  <circle
    cx="512" cy="512" r="360"
    fill="none"
    stroke="url(#ringGrad)"
    stroke-width="28"
    stroke-linecap="round"
    stroke-dasharray="1696 566"
    transform="rotate(-90 512 512)"
  />

  <!-- G letter: outer C-shape (270° arc: top → left → bottom → right) -->
  <path
    d="M 512 292 A 220 220 0 0 0 732 512"
    fill="none"
    stroke="#ffffff"
    stroke-width="48"
    stroke-linecap="round"
    class="g-body"
  />

  <!-- G letter: crossbar -->
  <path
    d="M 512 512 L 700 512"
    fill="none"
    stroke="#ffffff"
    stroke-width="48"
    stroke-linecap="round"
    class="g-bar"
  />

  <!-- Subtle glow behind progress ring gap -->
  <circle
    cx="512" cy="512" r="14"
    fill="#f97316"
    opacity="0.15"
  />
</svg>

<router-outlet />

@if (updateAvailable()) {
  <div class="fixed bottom-24 left-4 right-4 max-w-lg mx-auto z-50 animate-slide-up">
    <div class="bg-surface-elevated rounded-2xl p-4 shadow-2xl border border-white/10">
      <div class="flex items-center gap-3">
        <div class="flex-1">
          <p class="text-sm font-medium text-on-surface">New version available</p>
          <p class="text-xs text-on-surface-muted mt-0.5">Refresh to get the latest features.</p>
        </div>
        <button ui-button variant="primary" size="sm" (click)="activateUpdate()">Update</button>
      </div>
    </div>
  </div>
}

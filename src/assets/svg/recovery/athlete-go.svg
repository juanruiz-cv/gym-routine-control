<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" fill="none" role="img" aria-label="Personaje listo para entrenar">
  <style>
    .bounce { animation: goBounce 0.45s ease-out infinite alternate; transform-origin: 60px 85px; }
    .glow { animation: goPulse 0.7s ease-in-out infinite; }
    .sp1 { animation: sparkle 0.9s ease-in-out infinite; }
    .sp2 { animation: sparkle 0.9s ease-in-out 0.3s infinite; }
    .sp3 { animation: sparkle 0.9s ease-in-out 0.6s infinite; }
    .sp4 { animation: sparkle 0.8s ease-in-out 0.15s infinite; }
    .sp5 { animation: sparkle 0.8s ease-in-out 0.5s infinite; }
    @keyframes goBounce { 0%{transform:scale(1) translateY(0)} 100%{transform:scale(1.07) translateY(-8px)} }
    @keyframes goPulse { 0%,100%{opacity:.18} 50%{opacity:.45} }
    @keyframes sparkle { 0%,100%{opacity:0;transform:translateY(0) scale(0)} 50%{opacity:1;transform:translateY(-16px) scale(1)} }
    @media (prefers-reduced-motion: reduce) { .bounce{transform:scale(1.03);animation:none} .glow,.sp1,.sp2,.sp3,.sp4,.sp5{animation:none} .sp1,.sp2,.sp3,.sp4,.sp5{opacity:0} }
  </style>

  <!-- Ground shadow -->
  <ellipse cx="60" cy="124" rx="20" ry="3" fill="#ffffff08"/>

  <!-- Sparkles -->
  <circle class="sp1" cx="30" cy="28" r="3" fill="#4ade80"/>
  <circle class="sp2" cx="90" cy="22" r="2.5" fill="#22c55e"/>
  <circle class="sp3" cx="45" cy="14" r="3.5" fill="#86efac"/>
  <circle class="sp4" cx="80" cy="40" r="2" fill="#4ade80"/>
  <circle class="sp5" cx="38" cy="60" r="2.5" fill="#22c55e"/>
  <!-- Speed lines -->
  <line class="sp2" x1="22" y1="44" x2="14" y2="44" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>
  <line class="sp4" x1="98" y1="50" x2="106" y2="50" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>

  <g class="bounce">
    <!-- Legs jumping wide -->
    <path d="M60,82 L50,108 L44,116" stroke="#22c55e" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M60,82 L70,108 L76,116" stroke="#22c55e" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Feet up -->
    <circle cx="44" cy="116" r="5.5" fill="#22c55e"/>
    <circle cx="76" cy="116" r="5.5" fill="#22c55e"/>

    <!-- Torso powerful -->
    <line x1="60" y1="82" x2="60" y2="44" stroke="#22c55e" stroke-width="5.5" stroke-linecap="round"/>

    <!-- Arms up in victory/flex -->
    <path d="M60,54 L48,42 L38,48 L42,56" stroke="#22c55e" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M60,54 L72,42 L82,48 L78,56" stroke="#22c55e" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Fists up -->
    <circle cx="38" cy="48" r="5.5" fill="#22c55e"/>
    <circle cx="82" cy="48" r="5.5" fill="#22c55e"/>
    <circle cx="42" cy="56" r="5.5" fill="#22c55e"/>
    <circle cx="78" cy="56" r="5.5" fill="#22c55e"/>

    <!-- Head hero -->
    <circle cx="60" cy="35" r="12.5" fill="#1c1c1e" stroke="#22c55e" stroke-width="4.5"/>
    <!-- Wide excited eyes -->
    <circle cx="54" cy="33" r="3.2" fill="#22c55e"/>
    <circle cx="66" cy="33" r="3.2" fill="#22c55e"/>
    <circle cx="55" cy="32" r="1.3" fill="#4ade80"/>
    <circle cx="65" cy="32" r="1.3" fill="#4ade80"/>
    <!-- Big grin -->
    <path d="M54,40 Q60,45 66,40" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Intense green glow -->
  <circle class="glow" cx="60" cy="65" r="55" fill="url(#go)"/>
  <defs><radialGradient id="go"><stop offset="0%" stop-color="#22c55e"/><stop offset="40%" stop-color="#4ade80"/><stop offset="100%" stop-color="transparent"/></radialGradient></defs>
</svg>
